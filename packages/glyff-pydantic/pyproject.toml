[project]
name = "glyff-pydantic"
description = "Pydantic-based Serializer and ArgsHasher for glyff."
requires-python = ">=3.11"
dependencies = [
    "glyff>=0.1.0",
    "pydantic>=2.0",
]
dynamic = ["version"]

[tool.uv.sources]
glyff = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyff_pydantic"]
exclude = ["src/glyff_pydantic/tests"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/glyff_pydantic/tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
