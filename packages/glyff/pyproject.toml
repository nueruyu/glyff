[project]
name = "glyff"
description = "Guaranteed Lightweight Yieldable Function Foundation for checkpointed and resumable task execution."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
# glyff.testing's conformance contracts are async pytest test classes.
testing = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyff"]
exclude = ["src/glyff/tests"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/glyff/tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
