[tool.uv.workspace]
members = [
    "packages/glyff",
    "packages/glyff-file-store",
    "packages/glyff-pydantic",
    "packages/glyff-sqlite",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.coverage.run]
branch = true
source = [
    "glyff",
    "glyff_file_store",
    "glyff_pydantic",
    "glyff_sqlite",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pyright]
include = [
    "packages/glyff/src",
    "packages/glyff-pydantic/src",
    "packages/glyff-file-store/src",
    "packages/glyff-sqlite/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
