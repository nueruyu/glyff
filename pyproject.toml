[tool.uv.workspace]
members = [
    "packages/glyff",
    "packages/glyff-file-store",
    "packages/glyff-pydantic",
    "packages/glyff-sqlite",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[tool.pyright]
include = [
    "packages/glyff/src",
    "packages/glyff-pydantic/src",
    "packages/glyff-file-store/src",
    "packages/glyff-sqlite/src",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
